    <header class="header">
        <div class="background">
        <img src="images/Logos/TecnoImpacto.webp" loading="lazy" alt="TecnoImpacto Logo">
        </div>
    </header>

<!-- Contenedor principal de los botones -->
    <div class="container">
    <header>
        <nav>
            <button class="dropdown" onclick="toggleDropdown('gorras')">Gorras ▼</button>
            <button class="dropdown" onclick="toggleDropdown('forros')">Forros ▼</button>
            <button class="dropdown" onclick="toggleDropdown('relojes')">Relojes ▼</button>
            <button class="dropdown" onclick="toggleDropdown('gafas')">Gafas ▼</button>
            <button id="theme-toggle" onclick="toggleTheme()"></button>
        </nav>
    </header>
    </div>


    <div class="dropdown-content" id="gorras-dropdown">
        <!-- Opciones de gorras -->
        <button class="item" onclick="updateProductImage('gorras', 1)">Gorra Deportiva</button>
        <button class="item" onclick="updateProductImage('gorras', 2)">Gorra de Béisbol</button>
    </div>

    <div class="dropdown-content" id="relojes-dropdown">
        <!-- Opciones de relojes -->
        <button class="item" onclick="updateProductImage('relojes', 1)">Reloj Deportivo</button>
        <button class="item" onclick="updateProductImage('relojes', 2)">Reloj de Pulsera</button>
    </div>

    <div class="dropdown-content" id="forros-dropdown">
        <!-- Opciones de forros -->
        <button class="item" onclick="updateProductImage('forros', 1)">Forro Fino</button>
        <button class="item" onclick="updateProductImage('forros', 2)">Forro Protector</button>
    </div>

    <div class="dropdown-content" id="gafas-dropdown">
        <!-- Opciones de gafas -->
        <button class="item" onclick="updateProductImage('gafas', 1)">Gafas de Sol</button>
        <button class="item" onclick="updateProductImage('gafas', 2)">Gafas de Lectura</button>
    </div>
